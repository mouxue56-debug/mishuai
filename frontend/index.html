<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ミケ - 福楽キャッテリー AI秘書</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Live2D Cubism SDK (CDN) -->
    <!-- NOTE: You need to download the Live2D Cubism SDK for Web and host it locally
         OR use a CDN. The official SDK requires agreement to their license.
         For development, you can use pixi-live2d-display which wraps the SDK: -->
    <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/dylanNew/live2d/webgl/Live2D/lib/live2d.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@7.x/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/index.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Live2D Canvas -->
        <div id="live2d-container">
            <canvas id="live2d-canvas"></canvas>
        </div>

        <!-- Status Indicator -->
        <div id="status-bar">
            <div id="status-dot" class="idle"></div>
            <span id="status-text">待機中</span>
            <span id="emotion-badge">😊 neutral</span>
        </div>

        <!-- Subtitle Area -->
        <div id="subtitle-area">
            <div id="subtitle-text"></div>
        </div>

        <!-- Chat Panel (toggleable) -->
        <div id="chat-panel" class="collapsed">
            <div id="chat-toggle" onclick="toggleChat()">💬 チャット</div>
            <div id="chat-messages"></div>
            <div id="chat-input-area">
                <input type="text" id="chat-input" placeholder="テキストで話しかける..."
                       onkeydown="if(event.key==='Enter')sendChat()">
                <button onclick="sendChat()">送信</button>
            </div>
        </div>

        <!-- Settings Panel -->
        <div id="settings-panel" class="hidden">
            <h3>設定</h3>
            <div class="setting-group">
                <label>LLMモード:</label>
                <select id="llm-mode" onchange="setLLMMode(this.value)">
                    <option value="quality">品質優先 (Claude)</option>
                    <option value="balanced" selected>バランス (Gemini)</option>
                    <option value="budget">節約 (GPT-4o mini)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>言語:</label>
                <select id="tts-language" onchange="setLanguage(this.value)">
                    <option value="japanese" selected>日本語</option>
                    <option value="chinese">中文</option>
                </select>
            </div>
        </div>

        <!-- Control buttons -->
        <div id="controls">
            <button id="btn-settings" onclick="toggleSettings()" title="設定">⚙️</button>
            <button id="btn-mute" onclick="toggleMute()" title="ミュート">🔊</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/ws_client.js"></script>
    <script src="js/emotion_mapper.js"></script>
    <script src="js/lip_sync.js"></script>
    <script src="js/live2d_controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
