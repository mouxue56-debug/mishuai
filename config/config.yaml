# ============================================
# Fukuraku AI Secretary - Main Configuration
# ============================================

# --- Application ---
app:
  name: "Fukuraku AI Secretary"
  version: "0.3.0"
  language: "ja"  # Primary: Japanese
  debug: false

# --- LLM Models (Multi-model routing) ---
llm:
  # Main conversation (personality matters)
  conversation:
    primary:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 2048
      temperature: 2
    fallback:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 1024
      temperature: 0.8
    budget:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 1024
      temperature: 0.8

  # Tool execution (accuracy matters)
  tool_use:
    primary:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 512
      temperature: 0.3
    fallback:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 512
      temperature: 0.3

  # Summarization / memory (batch, cost-sensitive)
  summarization:
    primary:
      provider: "qianwen"
      model: "qwen-plus"
      max_tokens: 2048
      temperature: 0.5

  # Current active mode: "quality" | "balanced" | "budget"
  active_mode: "budget"

# --- ASR (Speech Recognition) ---
asr:
  engine: "dashscope" # "dashscope" | "sherpa_onnx" | "faster_whisper"
  language:  # Multi-language hints for DashScope
  - zh
  - en
  - ja
  dashscope:
    model: "paraformer-realtime-v2"
    sample_rate: 16000
  sherpa_onnx:
    model_path: "models/asr/"
    sample_rate: 16000

# --- TTS (Text-to-Speech) ---
tts:
  # Japanese TTS
  japanese:
    engine: "cosyvoice_dashscope" # "voicevox" | "cosyvoice_dashscope" | "edge_tts"
    voicevox:
      host: "http://127.0.0.1:50021"
      speaker_id: 3  # ずんだもん (can change to preferred voice)
      character: "zundamon"  # Emotion style mapping: "zundamon" | "metan"
      speed_scale: 1
      pitch_scale: -0.06
      intonation_scale: 1.2
    cosyvoice_dashscope:
      model: "cosyvoice-v3-flash"     # "cosyvoice-v3-flash" (fast) | "cosyvoice-v2-0.5b" (quality)
      voice: "loongtomoka_v3"         # Tomoka: mature Japanese female (30-35)
      format: "wav"
      sample_rate: 22050
    edge_tts:
      voice: "ja-JP-NanamiNeural"
      rate: "+10%"

  # Chinese TTS
  chinese:
    engine: "cosyvoice_dashscope"
    cosyvoice_dashscope:
      model: "cosyvoice-v3-flash"
      voice: "longanhuan"             # 安欢: social companion female (20-30), supports emotion instruct
      format: "wav"
      sample_rate: 22050

  # Active language for TTS output
  active_language: "chinese"

# --- Audio ---
audio:
  input:
    device_index:       # null = default mic
    sample_rate: 16000
    channels: 1
    chunk_size: 1024
  output:
    device_index:       # null = default speaker
    sample_rate: 24000
  vad:
    engine: "webrtc"  # "webrtc" (lightweight) | "silero" (ML-based, more accurate)
    mode: 3  # WebRTC VAD aggressiveness (0-3), ignored for silero
    frame_duration_ms: 30
    silence_threshold_ms: 800  # Silence duration to end utterance
    silero_threshold: 0.5  # Silero confidence threshold (0.0-1.0)
  wake_word:
    enabled: true
    engine: "sherpa_onnx"  # "sherpa_onnx" | "custom"
    keyword: "ユキちゃん"
    sensitivity: 0.5

# --- Speaker Recognition ---
speaker:
  enabled: true
  engine: "3d_speaker"  # "3d_speaker" (CAM++, accurate) | "resemblyzer" (lightweight)
  similarity_threshold: 0.45  # CAM++ embeddings use different scale; lower threshold is typical
  sample_rate: 16000
  profiles_path: "config/speaker_profiles.yaml"

# --- Vision (Camera → Gemini Flash) ---
vision:
  enabled: false  # Set true when camera is connected
  camera_index: 0
  capture_interval_sec: 10  # Seconds between captures
  model: "gemini-2.0-flash"
  resolution:
  - 640
  - 480
  jpeg_quality: 70
  prompt: >
    この画像は猫カフェ/キャッテリーの受付カメラです。 簡潔に(1-2文で)シーンを説明してください。 人が写っている場合は「[PERSON]」タグを先頭に付けてください。 猫が写っている場合は「[CAT]」タグを付けてください。 特に変化がなく静かなシーンなら「[QUIET]」とだけ返してください。

# --- Proactive Scheduler ---
proactive:
  enabled: false
  idle_timeout_min: 15       # (Legacy) Minutes before idle chatter
  idle_min_sec: 60           # Min random idle interval (1 min)
  idle_max_sec: 300          # Max random idle interval (5 min)
  greeting_hours:            # Hours to send time-based greetings
  - 9
  - 13
  check_interval_sec: 30     # How often to check triggers
  cooldown_sec: 60           # Minimum seconds between proactive messages
  weather_location: "Osaka"  # City for weather info (wttr.in format)

# --- Memory ---
memory:
  database_path: "data/memory.db"
  short_term:
    max_turns: 10
  mid_term:
    summary_interval_hours: 4
    daily_summary_time: "23:00"
  long_term:
    max_entries: 10000

# --- WebSocket (for Live2D frontend) ---
websocket:
  host: "0.0.0.0"
  port: 8765

# --- MCP Tools ---
mcp:
  enabled_tools:
  - search_customers
  - add_memo
  - set_reminder
  - draft_line_message
  - cattery_knowledge
  - check_schedule
  - generate_sns_caption
notion:
  customer_database_id: ""  # Fill from .env

# --- Logging ---
logging:
  level: "DEBUG" # DEBUG | INFO | WARNING | ERROR
  file: "logs/secretary.log"
  rotation: "10 MB"
  retention: "7 days"
